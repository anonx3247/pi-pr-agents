name: Test

# Runs the node:test + tsx unit suite for the pure helper functions on every
# push and pull request. No build step: pi loads the .ts extension directly and
# tsx executes the tests straight from TypeScript.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
