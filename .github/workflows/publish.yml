name: Publish to npm

# Publishes the package to the npm registry when you push a version tag
# (e.g. `git tag v0.1.0 && git push origin v0.1.0`) or publish a GitHub Release.
#
# Setup once:
#   1. Create an npm automation token: https://www.npmjs.com/settings/<you>/tokens
#   2. Add it as a repo secret named NPM_TOKEN
#      (Settings -> Secrets and variables -> Actions -> New repository secret)

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # No build step: pi loads the .ts extension directly. Just verify the
      # version tag matches package.json before publishing.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
